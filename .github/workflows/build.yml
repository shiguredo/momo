name: build-workflow

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "doc/**"
      - "html/**"
      - "**.md"
      - "THANKS"
      - "LICENSE"
      - "NOTICE"
      - "test/**"
      - ".github/workflows/e2e-test.yml"
      - ".github/workflows/claude.yml"
  schedule:
    # UTC の 01:00 は JST だと 10:00 。
    # 1-5 で 月曜日から金曜日
    - cron: "0 1 * * 1-5"

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        name:
          - windows_x86_64
    name: Build momo for ${{ matrix.name }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Get Versions
        run: |
          Get-Content "DEPS" | Foreach-Object {
            if (!$_) { continue }
            $var = $_.Split('=')
            New-Variable -Name $var[0] -Value $var[1] -Force
          }
          echo "cuda_version=${CUDA_VERSION}" >> ${Env:GITHUB_OUTPUT}
        id: versions
      # CUDA のインストールバイナリのダウンロードは 3GB ぐらいあって、
      # ビルドの度に取得するのはつらいのでキャッシュする
      # （インストールする nvcc は解凍後で 100MB 程度なのでキャッシュ可能）
      - name: Cache CUDA ${{ steps.versions.outputs.cuda_version }}
        id: cache-cuda
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: _install\windows_x86_64\release\cuda
          key: windows-cuda-${{ steps.versions.outputs.cuda_version }}.v1
      - run: echo "${CUDA_VERSION}" > _install\windows_x86_64\release\cuda.version
        if: steps.cache-cuda.outputs.cache-hit == 'true'
      - run: python3 run.py build --package ${{ matrix.name }}
      - name: Get package name
        run: |
          Get-Content "_package\${{ matrix.name }}\release\momo.env" | Foreach-Object {
            if (!$_) { continue }
            $var = $_.Split('=')
            New-Variable -Name $var[0] -Value $var[1] -Force
          }
          echo "name=${PACKAGE_NAME}" >> ${Env:GITHUB_OUTPUT}
        id: package_name
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package_name.outputs.name }}
          path: _package/${{ matrix.name }}/release/${{ steps.package_name.outputs.name }}
      - name: Upload Environment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}.env
          path: _package/${{ matrix.name }}/release/momo.env
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        name:
          - macos_arm64
    name: Build momo for ${{ matrix.name }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - run: python3 run.py build --package ${{ matrix.name }}
      - name: Get package name
        run: |
          source _package/${{ matrix.name }}/release/momo.env
          echo "name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
        id: package_name
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package_name.outputs.name }}
          path: _package/${{ matrix.name }}/release/${{ steps.package_name.outputs.name }}
      - name: Upload Environment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}.env
          path: _package/${{ matrix.name }}/release/momo.env
  build-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04_x86_64
            os: ubuntu-24.04
          - name: ubuntu-22.04_x86_64
            os: ubuntu-22.04
          - name: raspberry-pi-os_armv8
            os: ubuntu-22.04
          - name: ubuntu-22.04_armv8_jetson
            os: ubuntu-22.04
    name: Build momo for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Disk cleanup
        run: |
          set -x
          df -h
          sudo du -h -d1 /usr/local
          sudo du -h -d1 /usr/local/share
          sudo du -h -d1 /usr/local/lib
          sudo du -h -d1 /usr/share
          RMI=`docker images -q -a`
          if [ -n "$RMI" ]; then
            docker rmi $RMI
          fi
          # 4.6G
          sudo rm -rf /usr/local/.ghcup
          # 1.7G
          sudo rm -rf /usr/share/swift
          # 1.4G
          sudo rm -rf /usr/share/dotnet
          df -h
      - name: Install deps for cross-compile targets
        if: matrix.name == 'ubuntu-22.04_armv8_jetson' || matrix.name == 'raspberry-pi-os_armv8'
        run: |
          sudo apt-get update
          sudo apt-get -y install binutils-aarch64-linux-gnu
      - name: Verify sysroot keyring checksums
        if: matrix.name == 'ubuntu-22.04_armv8_jetson' || matrix.name == 'raspberry-pi-os_armv8'
        working-directory: sysroot/keyrings
        run: sha256sum -c SHA256SUMS
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        if: matrix.name == 'ubuntu-22.04_armv8_jetson' || matrix.name == 'raspberry-pi-os_armv8'
      - name: Test sysroot Python modules
        if: matrix.name == 'ubuntu-22.04_armv8_jetson' || matrix.name == 'raspberry-pi-os_armv8'
        run: uv run --with pytest --python 3.13 python -m pytest tests/
      - uses: shiguredo/github-actions/.github/actions/setup-cuda-toolkit@main
        if: matrix.name == 'ubuntu-24.04_x86_64' || matrix.name == 'ubuntu-22.04_x86_64'
        id: cuda
        with:
          platform: ${{ matrix.os }}
          cuda_version: 12.9.1
      - name: Install deps for ${{ matrix.name }}
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common

          # clang-20
          wget https://apt.llvm.org/llvm.sh
          chmod a+x llvm.sh
          sudo ./llvm.sh 20

      - name: Install deps for ${{ matrix.name }}
        if: matrix.name == 'ubuntu-24.04_x86_64' || matrix.name == 'ubuntu-22.04_x86_64'
        run: |
          # Intel VPL のために libva-dev, libdrm-dev を入れる
          DEBIAN_FRONTEND=noninteractive sudo apt-get -y install libva-dev libdrm-dev
          # スクリーンキャプチャあたりのためのパッケージを入れる
          DEBIAN_FRONTEND=noninteractive sudo apt-get -y install libxrandr-dev libxdamage-dev libxcomposite-dev libxtst-dev

      - run: python3 run.py build --package ${{ matrix.name }}
      - name: Verify Raspberry Pi OS sysroot contents
        if: matrix.name == 'raspberry-pi-os_armv8'
        run: |
          set -eu
          rootfs=_install/raspberry-pi-os_armv8/release/rootfs
          # 代表ヘッダで libcamera-dev と libstdc++-14-dev の install 成否を確認する。
          # libcamera は upstream 慣行で usr/include/libcamera/libcamera/ に配置される。
          test -f "$rootfs/usr/include/libcamera/libcamera/camera.h"
          test -f "$rootfs/usr/include/c++/14/vector"
          # 直接指定した 10 パッケージが manifest の deb_files に含まれることを確認する。
          # 依存で入る transitive package の件数はぶれるため、明示指定のパッケージだけを検証する。
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          rootfs = Path("_install/raspberry-pi-os_armv8/release/rootfs")
          manifest = json.loads((rootfs / ".webrtc-build-sysroot.json").read_text())
          config = json.loads(Path("sysroot/raspberry-pi-os_armv8.json").read_text())
          deb_files = manifest["deb_files"]
          missing = [
              package
              for package in config["packages"]
              if not any(name.startswith(f"{package}_") for name in deb_files)
          ]
          if missing:
              print(f"missing direct packages in deb_files: {missing}", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Verify Jetson sysroot contents
        if: matrix.name == 'ubuntu-22.04_armv8_jetson'
        run: |
          set -eu
          rootfs=_install/ubuntu-22.04_armv8_jetson/release/rootfs
          # NVIDIA が配置する共有ライブラリ実体と、後処理で作った相対 symlink が両方揃っているか。
          # symlink 側は `-L` で symlink であること + `-f` で resolve 先が実ファイルであることの両方を確認する。
          test -f "$rootfs/usr/lib/aarch64-linux-gnu/nvidia/libnvbuf_fdmap.so.1.0.0"
          test -L "$rootfs/usr/lib/aarch64-linux-gnu/nvidia/libnvbuf_fdmap.so"
          test -f "$rootfs/usr/lib/aarch64-linux-gnu/nvidia/libnvbuf_fdmap.so"
          # Jetson Multimedia API ヘッダの存在確認。CMakeLists の Jetson 分岐が参照する。
          test -f "$rootfs/usr/src/jetson_multimedia_api/include/NvBufSurface.h"
          # 直接指定したパッケージが manifest の deb_files に含まれることを確認する。
          # 依存で入る transitive package の件数はぶれるため、明示指定のパッケージだけを検証する。
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          rootfs = Path("_install/ubuntu-22.04_armv8_jetson/release/rootfs")
          manifest = json.loads((rootfs / ".webrtc-build-sysroot.json").read_text())
          config = json.loads(Path("sysroot/ubuntu-22.04_armv8_jetson.json").read_text())
          deb_files = manifest["deb_files"]
          missing = [
              package
              for package in config["packages"]
              if not any(name.startswith(f"{package}_") for name in deb_files)
          ]
          if missing:
              print(f"missing direct packages in deb_files: {missing}", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Get package name
        run: |
          source _package/${{ matrix.name }}/release/momo.env
          echo "name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
        id: package_name
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package_name.outputs.name }}
          path: _package/${{ matrix.name }}/release/${{ steps.package_name.outputs.name }}
      - name: Upload Environment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}.env
          path: _package/${{ matrix.name }}/release/momo.env

  # E2E テストの実行
  e2e_test:
    needs: [build-windows, build-macos, build-ubuntu]
    uses: ./.github/workflows/e2e-test.yml
    with:
      from_build: true
    secrets: inherit

  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/202')
    needs:
      - build-windows
      - build-macos
      - build-ubuntu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: ./.github/actions/download
        with:
          platform: windows_x86_64
      - uses: ./.github/actions/download
        with:
          platform: macos_arm64
      - uses: ./.github/actions/download
        with:
          platform: raspberry-pi-os_armv8
      - uses: ./.github/actions/download
        with:
          platform: ubuntu-22.04_x86_64
      - uses: ./.github/actions/download
        with:
          platform: ubuntu-24.04_x86_64
      # - uses: ./.github/actions/download
      #   with:
      #     platform: ubuntu-22.04_armv8_jetson
      - name: Env to output
        run: |
          # 改行をスペースに変換してpackage_pathsに設定
          echo "package_paths=$(cat package_paths.env | tr '\n' ' ')" >> $GITHUB_OUTPUT
        id: env
      - name: Release (Prerelease)
        if: contains(github.ref, 'canary')
        run: |
          gh release create "${{ github.ref_name }}" \
            ${{ steps.env.outputs.package_paths }} \
            --title "${{ github.ref_name }}" \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release (Stable)
        if: ${{ !contains(github.ref, 'canary') }}
        run: |
          gh release create "${{ github.ref_name }}" \
            ${{ steps.env.outputs.package_paths }} \
            --title "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  notification:
    name: Slack Notification
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
    needs:
      - build-windows
      - build-macos
      - build-ubuntu
      - e2e_test
      - create-release
    if: always()
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: momo
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
